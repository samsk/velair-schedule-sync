# Seed config for the optional local HA profile.
# Copy into tests/ha/config/configuration.yaml via make ha-up,
# install a pinned Velair commit under custom_components/velair,
# then finish the Velair config flow once.

default_config:

homeassistant:
  name: Velair Test
  unit_system: metric
  temperature_unit: C
  time_zone: Europe/Bratislava
  latitude: 48.1
  longitude: 17.1

logger:
  default: warning

input_boolean:
  hc1_heater:
  hc2_heater:
  hc3_heater:
  hc4_heater:
  eh1_heater:
  eh2_heater:
  hvac_heater:
  pool_heater:

input_number:
  hc1_temp: {name: hc1 temp, min: 0, max: 40, step: 0.5, initial: 20, unit_of_measurement: "°C"}
  hc2_temp: {name: hc2 temp, min: 0, max: 40, step: 0.5, initial: 20, unit_of_measurement: "°C"}
  hc3_temp: {name: hc3 temp, min: 0, max: 40, step: 0.5, initial: 20, unit_of_measurement: "°C"}
  hc4_temp: {name: hc4 temp, min: 0, max: 40, step: 0.5, initial: 20, unit_of_measurement: "°C"}
  eh1_temp: {name: eh1 temp, min: 0, max: 40, step: 0.5, initial: 19, unit_of_measurement: "°C"}
  eh2_temp: {name: eh2 temp, min: 0, max: 40, step: 0.5, initial: 19, unit_of_measurement: "°C"}
  hvac_temp: {name: hvac temp, min: 0, max: 40, step: 0.5, initial: 18, unit_of_measurement: "°C"}
  pool_temp: {name: pool temp, min: 0, max: 40, step: 0.5, initial: 28, unit_of_measurement: "°C"}

template:
  - sensor:
      - name: hc1_temp
        unique_id: seed_hc1_temp
        unit_of_measurement: "°C"
        state: "{{ states('input_number.hc1_temp') }}"
      - name: hc2_temp
        unique_id: seed_hc2_temp
        unit_of_measurement: "°C"
        state: "{{ states('input_number.hc2_temp') }}"
      - name: hc3_temp
        unique_id: seed_hc3_temp
        unit_of_measurement: "°C"
        state: "{{ states('input_number.hc3_temp') }}"
      - name: hc4_temp
        unique_id: seed_hc4_temp
        unit_of_measurement: "°C"
        state: "{{ states('input_number.hc4_temp') }}"
      - name: eh1_temp
        unique_id: seed_eh1_temp
        unit_of_measurement: "°C"
        state: "{{ states('input_number.eh1_temp') }}"
      - name: eh2_temp
        unique_id: seed_eh2_temp
        unit_of_measurement: "°C"
        state: "{{ states('input_number.eh2_temp') }}"
      - name: hvac_temp
        unique_id: seed_hvac_temp
        unit_of_measurement: "°C"
        state: "{{ states('input_number.hvac_temp') }}"
      - name: pool_temp
        unique_id: seed_pool_temp
        unit_of_measurement: "°C"
        state: "{{ states('input_number.pool_temp') }}"
      - name: outdoor_temperature
        unique_id: seed_outdoor
        unit_of_measurement: "°C"
        state: "10"

climate:
  - platform: generic_thermostat
    name: hc1
    unique_id: seed_hc1
    heater: input_boolean.hc1_heater
    target_sensor: sensor.hc1_temp
    min_temp: 5
    max_temp: 30
    precision: 0.5
    ac_mode: false
  - platform: generic_thermostat
    name: hc2
    unique_id: seed_hc2
    heater: input_boolean.hc2_heater
    target_sensor: sensor.hc2_temp
    min_temp: 5
    max_temp: 30
    precision: 0.5
  - platform: generic_thermostat
    name: hc3
    unique_id: seed_hc3
    heater: input_boolean.hc3_heater
    target_sensor: sensor.hc3_temp
    min_temp: 5
    max_temp: 30
    precision: 0.5
  - platform: generic_thermostat
    name: hc4
    unique_id: seed_hc4
    heater: input_boolean.hc4_heater
    target_sensor: sensor.hc4_temp
    min_temp: 5
    max_temp: 30
    precision: 0.5
  - platform: generic_thermostat
    name: heating_eh1
    unique_id: seed_eh1
    heater: input_boolean.eh1_heater
    target_sensor: sensor.eh1_temp
    min_temp: 1
    max_temp: 37
    precision: 0.5
  - platform: generic_thermostat
    name: heating_eh2
    unique_id: seed_eh2
    heater: input_boolean.eh2_heater
    target_sensor: sensor.eh2_temp
    min_temp: 1
    max_temp: 37
    precision: 0.5
  - platform: generic_thermostat
    name: hvac
    unique_id: seed_hvac
    heater: input_boolean.hvac_heater
    target_sensor: sensor.hvac_temp
    min_temp: 10
    max_temp: 30
    precision: 0.5
  - platform: generic_thermostat
    name: pool
    unique_id: seed_pool
    heater: input_boolean.pool_heater
    target_sensor: sensor.pool_temp
    min_temp: 8
    max_temp: 40
    precision: 0.5
